<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PCITコーディング練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #F4F6F4;
    --surface: #FFFFFF;
    --surface-2: #EBEFEC;
    --ink: #1A211E;
    --muted: #5D6B65;
    --line: #DBE2DD;
    --line-strong: #C3CDC7;
    --bd: #0D6B5F;
    --bd-soft: #E0F0EC;
    --ta: #5A4A9C;
    --ta-soft: #EAE7F7;
    --ok: #1A6B3C;
    --ok-soft: #E2F1E7;
    --ng: #A32A22;
    --ng-soft: #F8E8E6;
    --bear: #D8B288;
    --bear-in: #C59A6E;
    --bear-muzzle: #F2E3CB;
    --bear-nose: #6E4B33;
    --bear-eye: #2E2018;
    --ribbon: #C9AB7E;
    --ribbon-edge: #AD8C5D;
    --cheer: #F2B233;
    --cheer-ink: #6B4410;
    --blush: #F09AA6;
    --shadow: 0 1px 2px rgba(26, 33, 30, .06), 0 8px 24px -12px rgba(26, 33, 30, .18);
    --radius: 10px;
    --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Meiryo", sans-serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111614;
      --surface: #1A211E;
      --surface-2: #232B27;
      --ink: #E7EEEA;
      --muted: #9AA8A2;
      --line: #2C3531;
      --line-strong: #3D4844;
      --bd: #52C4B0;
      --bd-soft: #123630;
      --ta: #AA9DEC;
      --ta-soft: #241F3E;
      --ok: #62C284;
      --ok-soft: #14301F;
      --ng: #F09189;
      --ng-soft: #3B1B18;
      --bear: #DFBC95;
      --bear-in: #C99C6F;
      --bear-muzzle: #F6EBDA;
      --bear-nose: #6E4B33;
      --bear-eye: #2E2018;
      --ribbon: #D3B689;
      --ribbon-edge: #B0905F;
      --bear: #DFBC95;
    --bear-in: #C99C6F;
    --bear-muzzle: #F6EBDA;
    --bear-nose: #6E4B33;
    --bear-eye: #2E2018;
    --ribbon: #D3B689;
    --ribbon-edge: #B0905F;
    --cheer: #F7C34B;
      --cheer-ink: #6B4410;
      --blush: #F0939F;
      --cheer: #F7C34B;
    --cheer-ink: #6B4410;
    --blush: #F0939F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111614;
    --surface: #1A211E;
    --surface-2: #232B27;
    --ink: #E7EEEA;
    --muted: #9AA8A2;
    --line: #2C3531;
    --line-strong: #3D4844;
    --bd: #52C4B0;
    --bd-soft: #123630;
    --ta: #AA9DEC;
    --ta-soft: #241F3E;
    --ok: #62C284;
    --ok-soft: #14301F;
    --ng: #F09189;
    --ng-soft: #3B1B18;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  :where(button, select, [tabindex]):focus-visible {
    outline: 2px solid var(--bd);
    outline-offset: 2px;
  }

  /* ---- header ---- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 20px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .02em;
    margin-right: auto;
  }
  .counter {
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .counter b { color: var(--ink); font-weight: 600; }
  .progress {
    max-width: 720px;
    margin: 8px auto 0;
    padding: 0 20px 10px;
  }
  .progress-track {
    height: 3px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: var(--bd);
    border-radius: 99px;
    transition: width .25s ease;
  }

  /* ---- layout ---- */
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 18px 56px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .toolbar select, .btn-ghost {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar select { max-width: 340px; }
  .btn-ghost:disabled { opacity: .45; cursor: default; }
  .btn-ghost:disabled:hover { border-color: var(--line-strong); }
  .btn-ghost.accent { border-color: var(--bd); color: var(--bd); font-weight: 600; }
  .btn-ghost.accent:hover { background: var(--bd-soft); }
  .btn-ghost:hover, .toolbar select:hover { border-color: var(--bd); }
  .spacer { margin-left: auto; }

  /* ---- question card ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 22px 24px;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .q-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--surface-2);
    border-radius: 6px;
    padding: 2px 8px;
    letter-spacing: .04em;
  }
  .q-cat {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .02em;
  }
  .q-speaker {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ta);
    background: var(--ta-soft);
    border-radius: 6px;
    padding: 2px 9px;
    letter-spacing: .04em;
  }
  .q-context {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.95;
    color: var(--ink);
    margin-bottom: 6px;
    text-wrap: pretty;
  }
  .q-text .speaker { font-weight: 700; }
  .q-after { margin-top: 6px; margin-bottom: 0; }
  .choices.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .reaction-row { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--ta); }
  .reaction-label { font-size: 12px; color: var(--ta); font-weight: 700; margin-bottom: 6px; }
  .reaction-row .choices { margin-top: 0; }
  .q-text {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.95;
    text-wrap: pretty;
    margin: 0;
  }
  .q-text .blank {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--bd);
    padding: 0 2px;
  }
  .q-sub {
    margin-top: 12px;
    font-size: 13.5px;
    color: var(--muted);
    border-left: 2px solid var(--line-strong);
    padding-left: 12px;
  }

  /* ---- choices ---- */
  .choices {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 20px;
  }
  .choices.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .choices.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices.compact .choice { min-height: 44px; padding: 7px 8px; }
  .choices.compact .choice .lab { font-size: 14px; }
  .choice {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    min-height: 52px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    text-align: center;
    transition: border-color .12s, background .12s;
  }
  .choice:hover:not(:disabled) { border-color: var(--bd); background: var(--surface-2); }
  .choice:disabled { cursor: default; }
  .choice .key {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 19px;
    height: 19px;
    display: grid;
    place-items: center;
    flex: none;
  }
  .choice .lab { font-size: 15px; font-family: var(--font-display); font-weight: 500; }
  .choice[data-state="picked"] { border-color: var(--bd); background: var(--bd-soft); }
  .choice[data-state="correct"] { border-color: var(--ok); background: var(--ok-soft); }
  .choice[data-state="wrong"] { border-color: var(--ng); background: var(--ng-soft); }
  .choice[data-state="missed"] { border-color: var(--ok); border-style: dashed; background: var(--ok-soft); }
  .choice[data-state="missed"] .lab::after { content: " ← 正答"; font-size: 11.5px; font-family: var(--font-mono); color: var(--ok); }

  .legend {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 2px 14px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.7;
  }
  .legend b {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--ink);
    margin-right: 5px;
  }

  .blank-row { margin-top: 18px; }
  .blank-label {
    font-size: 12.5px;
    color: var(--muted);
    font-family: var(--font-mono);
    letter-spacing: .01em;
    margin-bottom: 7px;
  }
  .blank-row .choices { margin-top: 0; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
  }
  .btn {
    background: var(--bd);
    color: var(--surface);
    border: 1px solid var(--bd);
    border-radius: 8px;
    padding: 9px 20px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .hintkey { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

  /* ---- feedback ---- */
  .feedback {
    margin-top: 20px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .verdict {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    padding: 4px 12px;
    border-radius: 6px;
  }
  .verdict[data-ok="1"] { color: var(--ok); background: var(--ok-soft); }
  .verdict[data-ok="0"] { color: var(--ng); background: var(--ng-soft); }
  .answer-line {
    margin-top: 12px;
    font-size: 14.5px;
  }
  .answer-line .label { color: var(--muted); font-size: 12.5px; margin-right: 8px; }
  .code-chip {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    padding: 1px 7px;
    border-radius: 5px;
    background: var(--bd-soft);
    color: var(--bd);
  }
  .code-chip.ta { background: var(--ta-soft); color: var(--ta); }
  .code-chip.none { background: var(--surface-2); color: var(--muted); }
  .guide {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .guide span {
    font-family: var(--font-mono);
    color: var(--ink);
    background: var(--surface-2);
    padding: 1px 7px;
    border-radius: 5px;
  }

  /* ---- celebration ---- */
  .celebrate {
    position: relative;
    text-align: center;
    min-height: 176px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px 8px 64px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .confetti {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .popper {
    position: absolute;
    bottom: 6px;
    width: 58px;
    height: 58px;
    overflow: visible;
  }
  .popper.left { left: 4%; animation: shake 2.2s ease-in-out infinite; }
  .popper.right { right: 4%; transform: scaleX(-1); animation: shake-r 2.2s .3s ease-in-out infinite; }
  .popper .cone { fill: var(--bd); }
  .popper .band { stroke: var(--bd-soft); stroke-width: 4; stroke-linecap: round; }
  .popper .mouth { fill: var(--bear-muzzle); stroke: var(--bd); stroke-width: 1.2; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    8% { transform: rotate(-16deg); }
    16% { transform: rotate(6deg); }
    24% { transform: rotate(0); }
  }
  @keyframes shake-r {
    0%, 100% { transform: scaleX(-1) rotate(0); }
    8% { transform: scaleX(-1) rotate(-16deg); }
    16% { transform: scaleX(-1) rotate(6deg); }
    24% { transform: scaleX(-1) rotate(0); }
  }
  .celebrate-title {
    position: relative;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.5;
    color: var(--bd);
    text-wrap: balance;
  }
  .celebrate-sub {
    position: relative;
    margin-top: 6px;
    font-size: 13.5px;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    .popper { animation: none; }
  }

  /* ---- result ---- */
  .result-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .score {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    color: var(--bd);
  }
  .score small { font-size: 16px; color: var(--muted); font-weight: 400; }
  .miss-list { list-style: none; margin: 18px 0 0; padding: 0; }
  .miss-list li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .miss-list .n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 12.5px;
    padding-top: 3px;
    flex: none;
  }
  .miss-body { min-width: 0; }
  .miss-body p { margin: 0 0 4px; line-height: 1.6; }

  /* ---- data panel ---- */
  .panel {
    margin-top: 28px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .panel > summary {
    cursor: pointer;
    padding: 12px 18px;
    font-size: 13.5px;
    font-family: var(--font-display);
    font-weight: 500;
    list-style: none;
  }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::before { content: "＋ "; color: var(--muted); }
  .panel[open] > summary::before { content: "− "; }
  .panel-body {
    padding: 0 18px 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
  }
  .panel-body textarea {
    width: 100%;
    min-height: 130px;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.6;
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
  }
  .panel-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .note { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  .status { font-size: 12px; color: var(--bd); }

  /* ---- phone ---- */
  @media (max-width: 560px) {
    body { font-size: 14.5px; }
    .topbar-inner { padding: 9px 16px 0; gap: 4px 10px; }
    .brand { font-size: 13.5px; width: 100%; margin-right: 0; }
    .counter { font-size: 12px; }
    .progress { padding: 0 16px 8px; margin-top: 6px; }
    .wrap { padding-inline: 16px; padding-block: 14px 40px; }
    .toolbar { gap: 6px; margin-bottom: 14px; }
    .toolbar select, .btn-ghost { font-size: 12.5px; padding: 7px 10px; }
    .toolbar select { flex: 1 1 42%; min-width: 0; }
    #btn-finish { flex: 1 1 100%; }
    .spacer { margin-left: 0; }
    .card { padding: 16px 14px 18px; border-radius: 12px; }
    .q-text, .q-context { font-size: 16px; line-height: 1.85; }
    .q-sub { font-size: 13px; }
    .choices, .choices.cols-3, .choices.cols-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
    .choices.cols-2 { grid-template-columns: minmax(0, 1fr); }
    .choice { min-height: 54px; padding: 10px; }
    .choices.compact .choice { min-height: 48px; }
    .choice .lab { font-size: 15.5px; }
    .choice .key { display: none; }
    .legend { font-size: 11.5px; gap: 3px 12px; margin-top: 14px; }
    .actions { margin-top: 18px; gap: 8px; }
    .actions .btn { width: 100%; padding: 13px 20px; font-size: 15px; }
    .key-hint { display: none; }
    .hintkey { width: 100%; text-align: center; }
    .blank-label { font-size: 12px; white-space: normal; }
    .score { font-size: 34px; }
    .panel > summary { padding: 11px 14px; }
    .panel-body { padding: 0 14px 14px; }
    .panel-row .btn-ghost, .panel-row label.btn-ghost { flex: 1 1 46%; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>


<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">PCITコーディング練習帳</div>
    <div class="counter" id="counter">— / —</div>
    <div class="counter" id="score-live">正答 <b>0</b></div>
  </div>
  <div class="progress"><div class="progress-track"><div class="progress-fill" id="progress"></div></div></div>
</header>

<main class="wrap">
  <div class="toolbar">
    <select id="sel-category" aria-label="カテゴリ"></select>
    <select id="sel-mode" aria-label="出題モード">
      <option value="all">全問</option>
      <option value="wrong">誤答のみ</option>
      <option value="unseen">未解答のみ</option>
    </select>
    <button class="btn-ghost" id="btn-shuffle" aria-pressed="false">ランダム出題：オフ</button>
    <button class="btn-ghost accent spacer" id="btn-finish" hidden>ここまでで終了して結果を見る</button>
    <button class="btn-ghost" id="btn-restart" disabled title="誤答した問題だけを出題し直す。再挑戦分は正答数・正答率には加算しない">誤答からやり直す</button>
    <button class="btn-ghost accent" id="btn-back" hidden title="やり直しを中断し、中断していた出題の続きに戻る">続きに戻る</button>
    <button class="btn-ghost" id="btn-reset" title="成績を消して最初から出題し直す">最初から</button>
  </div>

  <section class="card" id="quiz-view">
    <div class="q-meta">
      <span class="q-num" id="q-num">Q—</span>
      <span class="q-speaker" id="q-speaker" hidden></span>
      <span class="q-cat" id="q-cat"></span>
    </div>
    <div class="q-context" id="q-context" hidden></div>
    <p class="q-text" id="q-text"></p>
    <div class="q-context q-after" id="q-after" hidden></div>
    <div id="q-sub"></div>
    <div id="q-input"></div>
    <div class="feedback" id="q-feedback" hidden></div>
    <div class="actions" id="q-actions"></div>
  </section>

  <section class="card" id="result-view" hidden>
    <div class="celebrate" id="celebrate" hidden>

  var KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
  var CELEBRATE_MIN = 5; // お祝いを出す最低解答数

  var el = {
    counter: document.getElementById("counter"),
    scoreLive: document.getElementById("score-live"),
    progress: document.getElementById("progress"),
    selCategory: document.getElementById("sel-category"),
    selMode: document.getElementById("sel-mode"),
    btnShuffle: document.getElementById("btn-shuffle"),
    btnFinish: document.getElementById("btn-finish"),
    btnRestart: document.getElementById("btn-restart"),
    btnReset: document.getElementById("btn-reset"),
    btnBack: document.getElementById("btn-back"),
    quizView: document.getElementById("quiz-view"),
    qNum: document.getElementById("q-num"),
    qCat: document.getElementById("q-cat"),
    qSpeaker: document.getElementById("q-speaker"),
    qContext: document.getElementById("q-context"),
    qAfter: document.getElementById("q-after"),
    qText: document.getElementById("q-text"),
    qSub: document.getElementById("q-sub"),
    qInput: document.getElementById("q-input"),
    qActions: document.getElementById("q-actions"),
    qFeedback: document.getElementById("q-feedback"),
    resultView: document.getElementById("result-view"),
    resultScore: document.getElementById("result-score"),
    resultDetail: document.getElementById("result-detail"),
    resultNote: document.getElementById("result-note"),
    resultMisses: document.getElementById("result-misses"),
    btnResume: document.getElementById("btn-resume"),
    btnRetryWrong: document.getElementById("btn-retry-wrong"),
    btnRetryAll: document.getElementById("btn-retry-all"),
    dataText: document.getElementById("data-text"),
    dataStatus: document.getElementById("data-status"),
    footnote: document.getElementById("footnote")
  };

  var data = null;
  var queue = [];
  var idx = 0;
  var picked = [];
  var blankPicks = [];
  var locked = false;
  var session = { correct: 0, done: 0, misses: [] };
  // overall: 初回解答のみを集計する通算成績（誤答のやり直しは加算しない）
  var overall = { answered: 0, correct: 0, seen: {} };
  // 誤答のやり直し中に中断している本編の出題状態
  var suspended = null;
  var shuffle = false;
  var history = loadHistory();

  /* ---------- storage ---------- */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveHistory() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  /* ---------- data loading ---------- */
  function parseEmbedded() {
    try { return JSON.parse(document.getElementById("embedded-questions").textContent); }
    catch (e) { return { categories: [], questions: [] }; }
  }

  function boot() {
    var embedded = parseEmbedded();
    var done = function (d, src) {
      setData(d);
      el.footnote.textContent = "問題データ: " + d.questions.length + "問（" + src + "） / 成績はこのブラウザに保存される";
    };
    try {
      fetch("questions.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) {
          if (d && Array.isArray(d.questions) && d.questions.length) done(d, "questions.json");
          else done(embedded, "内蔵データ");
        })
        .catch(function () { done(embedded, "内蔵データ"); });
    } catch (e) { done(embedded, "内蔵データ"); }
  }

  function setData(d) {
    data = d;
    if (!data.codeLabels) data.codeLabels = {};
    buildCategorySelect();
    el.dataText.value = JSON.stringify(data, null, 2);
    startSession();
  }

  function buildCategorySelect() {
    el.selCategory.innerHTML = "";
    var all = document.createElement("option");
    all.value = "*";
    all.textContent = "すべてのカテゴリ";
    el.selCategory.appendChild(all);
    (data.categories || []).forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name;
      el.selCategory.appendChild(o);
    });
  }

  function categoryName(id) {
    var c = (data.categories || []).filter(function (x) { return x.id === id; })[0];
    return c ? c.name : "";
  }

  /* ---------- session ---------- */
  function buildQueue() {
    var cat = el.selCategory.value;
    var mode = el.selMode.value;
    var list = data.questions.filter(function (q) {
      if (cat !== "*" && q.category !== cat) return false;
      var h = history[q.id];
      if (mode === "wrong") return h && h.wrong > 0 && h.lastCorrect === false;
      if (mode === "unseen") return !h;
      return true;
    });
    if (shuffle) {
      for (var i = list.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = list[i]; list[i] = list[j]; list[j] = t;
      }
    }
    return list;
  }

  function startSession(forced, keepOverall) {
    queue = forced || buildQueue();
    idx = 0;
    session = { correct: 0, done: 0, misses: [] };
    if (!keepOverall) { overall = { answered: 0, correct: 0, seen: {} }; suspended = null; }
    updateScore();
    if (!queue.length) {
      showEmpty();
      return;
    }
    el.resultView.hidden = true;
    el.quizView.hidden = false;
    render();
  }

  function showEmpty() {
    el.quizView.hidden = false;
    el.resultView.hidden = true;
    el.qNum.textContent = "—";
    el.qCat.textContent = "";
    el.qSpeaker.hidden = true;
    el.qContext.hidden = true;
    el.qAfter.hidden = true;
    el.qText.textContent = "該当する問題がない。出題モードまたはカテゴリを変更する。";
    el.qSub.innerHTML = "";
    el.qInput.innerHTML = "";
    el.qActions.innerHTML = "";
    el.qFeedback.hidden = true;
    updateProgress();
  }

  function current() { return queue[idx]; }

  function overallPct() {
    return overall.answered ? Math.round((overall.correct / overall.answered) * 100) : 0;
  }

  function updateScore() {
    if (overall.answered) {
      el.scoreLive.innerHTML = "正答 <b>" + overall.correct + " / " + overall.answered +
        "</b>（" + overallPct() + "%）";
    } else {
      el.scoreLive.innerHTML = "正答 <b>0</b>";
    }
    el.btnFinish.hidden = !(session.done > 0 && el.resultView.hidden);
    el.btnRestart.disabled = session.misses.length === 0;
    el.btnRestart.textContent = session.misses.length
      ? "誤答からやり直す（" + session.misses.length + "問）"
      : "誤答からやり直す";
    if (suspended) {
      var left = suspended.queue.length - suspended.idx;
      el.btnBack.hidden = false;
      el.btnBack.textContent = "続きに戻る（残り" + left + "問）";
    } else {
      el.btnBack.hidden = true;
    }
  }

  function updateProgress() {
    var total = queue.length;
    el.counter.textContent = total ? (Math.min(idx + 1, total) + " / " + total) : "— / —";
    el.progress.style.width = total ? ((session.done / total) * 100) + "%" : "0%";
  }

  /* ---------- rendering ---------- */
  function render() {
    var q = current();
    locked = false;
    picked = [];
    blankPicks = (q.blanks || []).map(function () { return { code: null, reaction: null }; });

    el.qNum.textContent = "Q" + (q.number != null ? q.number : idx + 1);
    el.qCat.textContent = categoryName(q.category);
    el.qSpeaker.hidden = true;
    if (q.context) { el.qContext.textContent = q.context; el.qContext.hidden = false; }
    else { el.qContext.hidden = true; }
    if (q.after) { el.qAfter.textContent = q.after; el.qAfter.hidden = false; }
    else { el.qAfter.hidden = true; }
    renderText(q);

    var sub = "";
    if (q.hint) sub += "<div class=\"q-sub\">" + esc(q.hint) + "</div>";
    if (q.example) sub += "<div class=\"q-sub\">" + esc(q.example) + "</div>";
    el.qSub.innerHTML = sub;

    el.qFeedback.hidden = true;
    el.qFeedback.innerHTML = "";
    el.qInput.innerHTML = "";
    el.qActions.innerHTML = "";

    if (q.type === "blanks") renderBlanks(q);
    else renderChoices(q);

    renderLegend(q);
    updateProgress();
  }

  function renderLegend(q) {
    var opts = q.type === "blanks"
      ? (q.blanks[0] ? q.blanks[0].options : [])
      : (q.options || []);
    var labels = data.codeLabels || {};
    var known = opts.filter(function (o) { return labels[o]; });
    if (!known.length || known.length !== opts.length) return;
    if (q.type === "blanks" && q.blanks[0] && q.blanks[0].reaction) {
      q.blanks[0].reaction.options.forEach(function (o) {
        if (labels[o] && known.indexOf(o) < 0) known.push(o);
      });
    }
    var div = document.createElement("div");
    div.className = "legend";
    div.innerHTML = known.map(function (o) {
      var full = String(labels[o]);
      var rest = full.indexOf(o) === 0 ? full.slice(o.length) : full;
      rest = rest.replace(/^\s*[（(]/, "").replace(/[)）]\s*$/, "");
      return "<span><b>" + esc(o) + "</b>" + esc(rest) + "</span>";
    }).join("");
    el.qInput.appendChild(div);
  }

  function renderText(q) {
    var t = esc(q.text)
      .replace(/＿+/g, "<span class=\"blank\">＿＿＿</span>")
      .replace(/【(\d)】/g, "<span class=\"blank\">【$1】</span>");
    if (q.speaker) t = "<span class=\"speaker\">" + esc(q.speaker) + "：</span>" + t;
    el.qText.innerHTML = t;
  }

  function makeChoice(label, keyLabel, onClick) {
    var b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    b.innerHTML = (keyLabel ? "<span class=\"key\">" + esc(keyLabel) + "</span>" : "") +
      "<span class=\"lab\">" + esc(label) + "</span>";
    b.addEventListener("click", onClick);
    return b;
  }

  function renderChoices(q) {
    var wrapEl = document.createElement("div");
    wrapEl.className = choicesClass(q.options);
    q.options.forEach(function (opt, i) {
      var b = makeChoice(opt, KEYS[i] || "", function () { onPick(q, opt, b, wrapEl); });
      b.dataset.opt = opt;
      wrapEl.appendChild(b);
    });
    el.qInput.appendChild(wrapEl);

    if (q.type === "multi") {
      var need = q.selectCount || (q.answer || []).length;
      var btn = document.createElement("button");
      btn.className = "btn";
      btn.type = "button";
      btn.textContent = "判定する";
      btn.disabled = true;
      btn.addEventListener("click", function () { judge(q); });
      el.qActions.appendChild(btn);
      var note = document.createElement("span");
      note.className = "hintkey";
      note.textContent = need + "つ選択";
      el.qActions.appendChild(note);
    }
  }

  function reactionApplies(bl, code) {
    if (!bl.reaction) return false;
    var forCodes = bl.reaction.showFor || ["DC", "IC"];
    return forCodes.indexOf(code) >= 0;
  }

  function renderBlanks(q) {
    q.blanks.forEach(function (bl, bi) {
      var row = document.createElement("div");
      row.className = "blank-row";
      var lab = document.createElement("div");
      lab.className = "blank-label";
      lab.textContent = bl.label;
      row.appendChild(lab);

      var reactRow = null;
      var choices = document.createElement("div");
      choices.className = choicesClass(bl.options);
      choices.dataset.blank = String(bi);
      choices.dataset.part = "code";
      bl.options.forEach(function (opt) {
        var b = makeChoice(opt, "", function () {
          if (locked) return;
          blankPicks[bi].code = opt;
          Array.prototype.forEach.call(choices.children, function (c) {
            c.dataset.state = c.dataset.opt === opt ? "picked" : "";
          });
          if (reactRow) {
            var show = reactionApplies(bl, opt);
            reactRow.hidden = !show;
            if (!show) {
              blankPicks[bi].reaction = null;
              Array.prototype.forEach.call(reactRow.querySelector(".choices").children, function (c) {
                c.dataset.state = "";
              });
            }
          }
          syncBlankButton(q);
        });
        b.dataset.opt = opt;
        choices.appendChild(b);
      });
      row.appendChild(choices);

      if (bl.reaction) {
        reactRow = document.createElement("div");
        reactRow.className = "reaction-row";
        reactRow.hidden = true;
        var rlab = document.createElement("div");
        rlab.className = "reaction-label";
        rlab.textContent = bl.reaction.label || "子の反応";
        reactRow.appendChild(rlab);
        var rchoices = document.createElement("div");
        rchoices.className = choicesClass(bl.reaction.options);
        rchoices.dataset.blank = String(bi);
        rchoices.dataset.part = "reaction";
        bl.reaction.options.forEach(function (opt) {
          var b = makeChoice(opt, "", function () {
            if (locked) return;
            blankPicks[bi].reaction = opt;
            Array.prototype.forEach.call(rchoices.children, function (c) {
              c.dataset.state = c.dataset.opt === opt ? "picked" : "";
            });
            syncBlankButton(q);
          });
          b.dataset.opt = opt;
          rchoices.appendChild(b);
        });
        reactRow.appendChild(rchoices);
        row.appendChild(reactRow);
      }

      el.qInput.appendChild(row);
    });
    var btn = document.createElement("button");
    btn.className = "btn";
    btn.id = "blank-judge";
    btn.type = "button";
    btn.textContent = "判定する";
    btn.disabled = true;
    btn.addEventListener("click", function () { judge(q); });
    el.qActions.appendChild(btn);
  }

  function syncBlankButton(q) {
    var btn = document.getElementById("blank-judge");
    if (!btn) return;
    btn.disabled = q.blanks.some(function (bl, bi) {
      var p = blankPicks[bi];
      if (!p || !p.code) return true;
      if (reactionApplies(bl, p.code) && !p.reaction) return true;
      return false;
    });
  }

  function blankAnswerText(bl) {
    return bl.answer + (bl.reaction && bl.reaction.answer ? "/" + bl.reaction.answer : "");
  }

  function onPick(q, opt, btn, wrapEl) {
    if (locked) return;
    if (q.type === "single") {
      picked = [opt];
      judge(q);
      return;
    }
    var need = q.selectCount || (q.answer || []).length;
    var at = picked.indexOf(opt);
    if (at >= 0) picked.splice(at, 1);
    else if (picked.length < need) picked.push(opt);
    else return;
    Array.prototype.forEach.call(wrapEl.children, function (c) {
      c.dataset.state = picked.indexOf(c.dataset.opt) >= 0 ? "picked" : "";
    });
    var judgeBtn = el.qActions.querySelector(".btn");
    if (judgeBtn) judgeBtn.disabled = picked.length !== need;
  }

  /* ---------- judging ---------- */
  function judge(q) {
    if (locked) return;
    locked = true;

    var answer, chosen;
    if (q.type === "blanks") {
      answer = q.blanks.map(blankAnswerText);
      chosen = blankPicks.map(function (p) {
        return p.code + (p.reaction ? "/" + p.reaction : "");
      });
    } else {
      answer = (q.answer || []).slice();
      chosen = picked.slice();
    }
    var ok = (q.type === "blanks")
      ? answer.every(function (a, i) { return chosen[i] === a; })
      : sameSet(answer, chosen);

    paintChoices(q, answer, chosen);
    recordResult(q, ok);
    showFeedback(q, answer, ok);
  }

  function paintChoices(q, answer, chosen) {
    var groups = el.qInput.querySelectorAll(".choices");
    if (q.type === "blanks") {
      Array.prototype.forEach.call(groups, function (g) {
        var bi = parseInt(g.dataset.blank, 10);
        var bl = q.blanks[bi];
        var isReact = g.dataset.part === "reaction";
        var ansVal = isReact ? (bl.reaction ? bl.reaction.answer : null) : bl.answer;
        var pickVal = isReact ? blankPicks[bi].reaction : blankPicks[bi].code;
        if (isReact && ansVal) {
          var rr = g.parentNode;
          if (rr && rr.classList.contains("reaction-row")) rr.hidden = false;
        }
        Array.prototype.forEach.call(g.children, function (c) {
          var isAns = ansVal != null && c.dataset.opt === ansVal;
          var isPick = pickVal != null && c.dataset.opt === pickVal;
          c.disabled = true;
          c.dataset.state = isAns ? (isPick ? "correct" : "missed") : (isPick ? "wrong" : "");
        });
      });
      return;
    }
    Array.prototype.forEach.call(groups, function (g) {
      Array.prototype.forEach.call(g.children, function (c) {
        var isAns = answer.indexOf(c.dataset.opt) >= 0;
        var isPick = chosen.indexOf(c.dataset.opt) >= 0;
        c.disabled = true;
        c.dataset.state = isAns ? (isPick ? "correct" : "missed") : (isPick ? "wrong" : "");
      });
    });
  }

  function recordResult(q, ok) {
    session.done++;
    if (ok) session.correct++;
    else session.misses.push(q);

    // やり直しで正解した問題は、中断中の本編の誤答リストから外す
    if (suspended && ok) {
      suspended.session.misses = suspended.session.misses.filter(function (m) {
        return m.id !== q.id;
      });
    }

    // 通算成績は初回解答のみ集計する（やり直し分は加算しない）
    if (!overall.seen[q.id]) {
      overall.seen[q.id] = true;
      overall.answered++;
      if (ok) overall.correct++;
    }
    updateScore();

    var h = history[q.id] || { seen: 0, wrong: 0 };
    h.seen++;
    if (!ok) h.wrong++;
    h.lastCorrect = ok;
    h.ts = Date.now();
    history[q.id] = h;
    saveHistory();
    updateProgress();
  }

  function codeChip(v) {
    var parts = String(v).split("/");
    var cls = "code-chip" + (v === "TA" ? " ta" : (v === "No Code" ? " none" : ""));
    var label = parts.map(function (p) {
      return (data.codeLabels && data.codeLabels[p]) ? data.codeLabels[p] : p;
    }).join("／");
    return "<span class=\"" + cls + "\">" + esc(label) + "</span>";
  }

  function showFeedback(q, answer, ok) {
    var html = "<div class=\"verdict\" data-ok=\"" + (ok ? "1" : "0") + "\">" + (ok ? "正解" : "不正解") + "</div>";
    html += "<div class=\"answer-line\"><span class=\"label\">正答</span>" +
      answer.map(codeChip).join(q.type === "blanks" ? " → " : " ・ ") + "</div>";
    if (q.guideline) html += "<div class=\"guide\">適用されるガイドライン: <span>" + esc(q.guideline) + "</span></div>";
    if (q.note) html += "<div class=\"guide\">" + esc(q.note) + "</div>";
    el.qFeedback.innerHTML = html;
    el.qFeedback.hidden = false;

    el.qActions.innerHTML = "";
    var next = document.createElement("button");
    next.className = "btn";
    next.type = "button";
    next.textContent = (idx + 1 >= queue.length) ? "結果を見る" : "次の問題";
    next.addEventListener("click", advance);
    el.qActions.appendChild(next);
    var kh = document.createElement("span");
    kh.className = "hintkey key-hint";
    kh.textContent = "Enter";
    el.qActions.appendChild(kh);
    next.focus();
  }

  function advance() {
    if (idx + 1 >= queue.length) { showResult(); return; }
    idx++;
    render();
  }

  /* ---------- result ---------- */
  function showResult() {
    el.quizView.hidden = true;
    el.resultView.hidden = false;
    el.resultScore.innerHTML = overallPct() + "<small>%</small>";
    var detail = "正答 " + overall.correct + " / " + overall.answered + " 問（初回解答のみ集計）";
    var remain = queue.length - session.done;
    if (remain > 0) detail += " ／ 今回の出題 " + queue.length + " 問中 " + session.done + " 問を解答（残り " + remain + " 問）";
    el.resultDetail.textContent = detail;
    el.resultNote.textContent = session.misses.length
      ? "誤答した問題は下に一覧表示される。該当ガイドラインを確認してから再挑戦する。"
      : (session.done ? "全問正解。" : "解答した問題がない。");
    el.btnResume.hidden = !(remain > 0);
    el.resultMisses.innerHTML = "";
    session.misses.forEach(function (q) {
      var li = document.createElement("li");
      var ans = (q.type === "blanks")
        ? q.blanks.map(blankAnswerText).join(" → ")
        : (q.answer || []).join(" ・ ");
      li.innerHTML = "<span class=\"n\">Q" + (q.number != null ? q.number : "") + "</span>" +
        "<div class=\"miss-body\"><div class=\"q-cat\">" + esc(categoryName(q.category)) + "</div>" +
        "<p>" + esc(stripBlanks(q.text)) + "</p>" +
        "<div class=\"guide\">正答 <span>" + esc(ans) + "</span>" +
        (q.guideline ? " ／ " + esc(q.guideline) : "") + "</div></div>";
      el.resultMisses.appendChild(li);
    });
    el.btnRetryWrong.disabled = session.misses.length === 0;
    showCelebration();
    updateScore();
    updateProgress();
  }

  /* ---------- お祝い表示（正答率80%以上） ---------- */
  var CELEBRATE = {
    perfect: ["満点です！", "全問正解、お見事です！", "パーフェクト！"],
    high: ["すばらしいです！", "コーディングばっちりですね", "とても正確です！"],
    good: ["おめでとうございます", "よくできました！", "合格ラインです！"]
  };

  function showCelebration() {
    var pct = overallPct();
    var box = document.getElementById("celebrate");
    if (overall.answered < CELEBRATE_MIN || pct < 80) {
      box.hidden = true;
      return;
    }
    var list = pct === 100 ? CELEBRATE.perfect : (pct >= 90 ? CELEBRATE.high : CELEBRATE.good);
    document.getElementById("celebrate-title").textContent =
      list[Math.floor(Math.random() * list.length)];
    document.getElementById("celebrate-sub").textContent =
      "正答率 " + pct + "%（" + overall.correct + " / " + overall.answered + " 問）";
    box.hidden = false;
    runConfetti(box);
  }

  function runConfetti(box) {
    var cv = document.getElementById("confetti");
    if (!cv || !cv.getContext) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = w * dpr;
    cv.height = h * dpr;
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var css = getComputedStyle(document.documentElement);
    function tok(name, fb) {
      var v = (css.getPropertyValue(name) || "").trim();
      return v || fb;
    }
    var colors = [tok("--bd", "#0D6B5F"), tok("--ta", "#5A4A9C"), tok("--cheer", "#F2B233"),
                  tok("--blush", "#F09AA6"), tok("--ok", "#1A6B3C")];

    // クラッカーの発射口（左下・右下）
    var muzzles = [
      { x: w * 0.04 + 40, y: h - 42, dir: -Math.PI / 3 },
      { x: w * 0.96 - 40, y: h - 42, dir: -Math.PI * 2 / 3 }
    ];

    var bits = [];
    muzzles.forEach(function (m) {
      for (var i = 0; i < 34; i++) {
        var a = m.dir + (Math.random() - 0.5) * 0.85;
        var sp = 7 + Math.random() * 9;
        bits.push({
          kind: "confetti",
          x: m.x, y: m.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          s: 3.5 + Math.random() * 4,
          r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
          c: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      for (var j = 0; j < 9; j++) {
        var a2 = m.dir + (Math.random() - 0.5) * 0.7;
        var sp2 = 8 + Math.random() * 7;
        bits.push({
          kind: "ribbon",
          x: m.x, y: m.y,
          vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2,
          len: 7 + Math.floor(Math.random() * 4),
          seg: 7 + Math.random() * 3,
          amp: 4 + Math.random() * 3,
          ph: Math.random() * Math.PI * 2,
          wob: 0.22 + Math.random() * 0.12,
          c: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    });

    var frames = 0;
    var MAX = 190;
    (function tick() {
      frames++;
      ctx.clearRect(0, 0, w, h);
      var alive = 0;
      var fade = Math.max(0, 1 - Math.max(0, frames - 120) / 70);

      bits.forEach(function (b) {
        b.vy += 0.19;
        b.vx *= 0.985;
        b.vy *= 0.985;
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < h + 40) alive++;
        ctx.globalAlpha = fade;

        if (b.kind === "confetti") {
          b.r += b.vr;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.r);
          ctx.fillStyle = b.c;
          ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 1.7);
          ctx.restore();
        } else {
          // くるくるしたリボン（進行方向の逆向きに波打たせる）
          b.ph += b.wob;
          var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
          var ux = -b.vx / sp, uy = -b.vy / sp;   // 進行方向の逆
          var px = -uy, py = ux;                  // 垂直方向
          ctx.save();
          ctx.strokeStyle = b.c;
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          for (var k = 0; k <= b.len; k++) {
            var off = Math.sin(b.ph + k * 0.9) * b.amp * (k / b.len);
            var X = b.x + ux * b.seg * k + px * off;
            var Y = b.y + uy * b.seg * k + py * off;
            if (k === 0) ctx.moveTo(X, Y);
            else ctx.lineTo(X, Y);
          }
          ctx.stroke();
          ctx.restore();
        }
      });

      ctx.globalAlpha = 1;
      if (alive && frames < MAX) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, w, h);
    })();
  }

  function finishNow() {
    if (!session.done) return;
    if (locked && idx + 1 < queue.length) idx++;
    showResult();
  }

  function startRetry() {
    var misses = session.misses.slice();
    if (!misses.length) return;
    if (!suspended) {
      suspended = {
        queue: queue,
        idx: (locked && idx + 1 <= queue.length) ? idx + 1 : idx,
        session: session
      };
    }
    startSession(misses, true);
  }

  function backToMain() {
    if (!suspended) return;
    queue = suspended.queue;
    idx = suspended.idx;
    session = suspended.session;
    suspended = null;
    el.resultView.hidden = true;
    el.quizView.hidden = false;
    if (idx >= queue.length) showResult();
    else render();
    updateScore();
  }

  function resumeSession() {
    if (idx >= queue.length) return;
    el.resultView.hidden = true;
    el.quizView.hidden = false;
    render();
    updateScore();
  }

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function stripBlanks(t) { return String(t).replace(/＿+/g, "＿＿＿"); }
  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    var s = a.slice().sort().join("|");
    var t = b.slice().sort().join("|");
    return s === t;
  }
  function longOptions(opts) {
    return opts.some(function (o) { return String(o).length > 8; });
  }
  function choicesClass(opts) {
    var n = opts.length;
    var cls = "choices";
    if (longOptions(opts)) cls += " cols-2";
    else if (n % 4 === 0) cls += "";
    else if (n % 5 === 0) cls += " cols-5";
    else if (n % 3 === 0) cls += " cols-3";
    if (n >= 8) cls += " compact";
    return cls;
  }

  /* ---------- events ---------- */
  el.selCategory.addEventListener("change", function () { startSession(); });
  el.selMode.addEventListener("change", function () { startSession(); });
  el.btnRestart.addEventListener("click", startRetry);
  el.btnBack.addEventListener("click", backToMain);
  el.btnReset.addEventListener("click", function () { startSession(); });
  el.btnFinish.addEventListener("click", finishNow);
  el.btnResume.addEventListener("click", resumeSession);
  el.btnShuffle.addEventListener("click", function () {
    shuffle = !shuffle;
    el.btnShuffle.setAttribute("aria-pressed", shuffle ? "true" : "false");
    el.btnShuffle.textContent = "ランダム出題：" + (shuffle ? "オン" : "オフ");
    startSession();
  });
  el.btnRetryAll.addEventListener("click", function () { startSession(); });
  el.btnRetryWrong.addEventListener("click", startRetry);

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (el.resultView.hidden === false) return;
    if (e.key === "Enter" && locked) { e.preventDefault(); advance(); return; }
    var n = KEYS.indexOf(e.key);
    if (n < 0 || locked) return;
    var q = current();
    if (!q || q.type === "blanks") return;
    var group = el.qInput.querySelector(".choices");
    if (group && group.children[n]) { e.preventDefault(); group.children[n].click(); }
  });

  document.getElementById("btn-export").addEventListener("click", function () {
    el.dataText.value = JSON.stringify(data, null, 2);
    el.dataStatus.textContent = "現在のデータを表示した";
  });
  document.getElementById("btn-copy").addEventListener("click", function () {
    el.dataText.select();
    try {
      navigator.clipboard.writeText(el.dataText.value);
      el.dataStatus.textContent = "コピーした";
    } catch (err) { el.dataStatus.textContent = "手動でコピーする"; }
  });
  document.getElementById("btn-apply").addEventListener("click", function () {
    applyJson(el.dataText.value);
  });
  document.getElementById("file-import").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { el.dataText.value = r.result; applyJson(r.result); };
    r.readAsText(f);
  });

  function applyJson(text) {
    try {
      var d = JSON.parse(text);
      if (!d || !Array.isArray(d.questions) || !d.questions.length) throw new Error("questions が空");
      setData(d);
      el.dataStatus.textContent = "読み込んだ（" + d.questions.length + "問）";
      el.footnote.textContent = "問題データ: " + d.questions.length + "問（読み込み済み） / 成績はこのブラウザに保存される";
    } catch (err) {
      el.dataStatus.textContent = "JSONエラー: " + err.message;
    }
  }

  boot();
})();
</script>
